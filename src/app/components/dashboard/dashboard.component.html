<div class="dashboard_background">
  <!-- Sidebar -->


  <app-business-credit-scoring-modal
    *ngIf="showBusinessCreditModal"
    [selectedPlanInput]="selectedPlan"
    [currentUserId]="currentUserId"
    [currentUserName]="fullName"
    (closeModal)="closeBusinessCreditModal()"
  >
  </app-business-credit-scoring-modal>


  <button class="hamburger" (click)="toggleSidebar()">
    ☰
  </button>
  <div class="overlay" *ngIf="isSidebarOpen" (click)="closeSidebar()"></div>
  <div>
    <app-sidebar [class.open]="isSidebarOpen"
                 (closeSidebar)="closeSidebar()" ></app-sidebar>
  </div>


  <!-- Main Content -->
  <main class="main-content">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="page-title">
        <img src="assets/images/ic_outline-dashboard.svg" alt="Home Icon" class="home-icon" />
        <h1>Home</h1>
      </div>

      <div class="top-bar-actions">
        <button class="notification-btn">
          <img src="assets/images/notification-icon.svg" alt="Home Icon" class="notification-icon" />
<!--          <span class="badge">3</span>-->
        </button>

        <div class="search-box">
          <img src="assets/images/search_icon.svg" alt="Step Icon" class="step_1_icon" />
          <input type="text" placeholder="Search Here..." />
        </div>
      </div>
    </header>

    <div class="content-area" *ngIf="showDashboard==false">
      <app-home-page (setData)="handleDashboard($event)"></app-home-page>
    </div>

    <!-- Content Area -->
    <div class="content-area" *ngIf="showDashboard==true">
      <!-- Tabs -->


      <div class="tabs">
        <div class="k-cursor-default" >
            <button  (click)="changeTab('individual_credit')" class="back-title col-sm-auto"
                  [ngClass]="{'text-muted-modified':!tables.individual_credit.selected}">Individual Credit Scoring
            </button>
            <button  (click)="changeTab('business_credit')" class="back-title col-sm-auto"
                  [ngClass]="{'text-muted-modified':!tables.business_credit.selected}" >Business Credit Scoring
            </button>

        </div>

      </div>
       <app-individual-statistics *ngIf="tables.individual_credit.selected"></app-individual-statistics>
      <app-business-statistics *ngIf="tables.business_credit.selected"></app-business-statistics>

    </div>
  </main>

  <!-- Individual Credit Scoring Modal -->
  <app-individual-credit-scoring-modal
    *ngIf="showIndividualModal"
    [selectedPlanInput]="selectedPlan"
    [currentUserId]="currentUserId"
    [currentUserName]="fullName"
    (closeModal)="closeIndividualModal()"
    (saved)="stepStatus['Individual Information'] = Status.draft"
    (formSubmit)="handleFormSubmit($event)">
  </app-individual-credit-scoring-modal>

  <!-- Pricing Plans Modal -->
  <app-pricing-plans-modal
    *ngIf="isPricingModalOpen"
    (closeModal)="closePricingModal()"
    (planSelected)="onPlanSelected($event)">
  </app-pricing-plans-modal>

  <!-- Payment Modal - ADD THIS SECTION -->
  <app-payment-modal
    *ngIf="isPaymentModalOpen"
    [isOpen]="isPaymentModalOpen"
    [selectedPlan]="selectedPlan"
    [userName]="fullName"
    (closeModal)="closePaymentModal()"
    (paymentComplete)="onPaymentComplete($event)">
  </app-payment-modal>
</div>
