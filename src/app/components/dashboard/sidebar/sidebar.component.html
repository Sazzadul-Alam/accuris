<aside class="sidebar">
  <div class="logo-container">
    <img src="assets/images/accuris-logo.png" alt="Accuris Logo" class="logo" />
  </div>

  <div class="sidebar-content">

  <nav class="nav-menu">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <img src="assets/images/ic_outline-dashboard-small.svg" alt="Home Icon" class="home-icon" />
      <span>Home</span>
    </a>

    <a routerLink="/under-construction" routerLinkActive="active" class="nav-item">
      <img src="assets/images/mdi_clipboard-text-history-outline.svg" alt="Home Icon" class="home-icon" />
      <span>Credit History</span>
    </a>

    <a routerLink="/under-construction" routerLinkActive="active" class="nav-item">
      <img src="assets/images/material-symbols_business-center-outline-rounded.svg" alt="Home Icon" class="home-icon" />
      <span>Business Profile</span>
    </a>

    <!-- CHANGED: This opens the modal now -->
<!--    <a (click)="openIndividualCreditScoringModal()" class="nav-item" style="cursor: pointer;">-->
    <a routerLink="/under-construction" routerLinkActive="active" class="nav-item">
      <img src="assets/images/individual_profile.svg" alt="Home Icon" class="home-icon" />
      <span>Individual Profile</span>
    </a>

    <a routerLink="/under-construction" routerLinkActive="active" class="nav-item">
      <img src="assets/images/profile-settings.svg" alt="Home Icon" class="home-icon" />
      <span>Profile & Settings</span>
    </a>

    <a routerLink="/under-construction" routerLinkActive="active" class="nav-item">
      <img src="assets/images/help-center-icon.svg" alt="Home Icon" class="home-icon" />
      <span>Help Center</span>
    </a>
  </nav>


  </div>
  <footer class="logout-section">
    <div class="footer-new">

      <!-- Left: avatar + info -->
      <div class="footer-left">
        <div
          class="profile-avatar"
          [style.background-image]="
        userImage
          ? 'url(' + userImage + ')'
          : 'url(/assets/images/avatar.png)'
      ">
        </div>

        <div class="user-info">
      <span class="user-name">
        {{ userName || 'Your name' }}
      </span>
          <span class="user-email">
        {{ email || 'your@email.com' }}
      </span>
        </div>
      </div>

      <!-- Right: logout -->
      <img
        src="assets/images/logout.svg"
        class="logout-icon"
        (click)="logout()"
        alt="Logout"
      />

    </div>



    <!--    <a (click)="logout()" class="nav-item logout">-->
<!--      <img src="assets/images/logout-icon.svg" class="home-icon" />-->
<!--      <span>Logout</span>-->
<!--    </a>-->
  </footer>
</aside>
