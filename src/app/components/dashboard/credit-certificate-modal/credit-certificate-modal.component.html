<div class="modal-backdrop">
  <div class="modal-container">
    <!-- Header -->
    <div class="modal-header">
      <div>
        <h2>Credit Scores</h2>
        <p class="subtitle">Your credit score</p>
      </div>
      <button class="close-btn" (click)="onClose()">✕</button>
    </div>

    <!-- Credit Score Cards -->
    <div class="score-card" *ngFor="let score of creditScores">
      <div class="card-header">
        <div>
          <strong>{{ score.name }}</strong>
          <div class="plan">Plan : {{ score.plan }}</div>
        </div>
        <span class="badge" *ngIf="score.isNew">New</span>
      </div>

      <div class="card-body">
        <!-- Dynamic Gauge -->
        <div class="gauge">
          <div class="arc" [ngClass]="getMeterClass(score.creditRating)">
            <div class="needle" [style.transform]="getNeedleRotation(score.creditRating)"></div>
          </div>
          <span class="gauge-label">Credit Risk</span>
        </div>

        <div class="details">
          <!-- Rating Details -->
          <div class="rating-details">
            <h4>Rating Details</h4>
            <ul>
              <li *ngFor="let detail of score.ratingDetails">• {{ detail }}</li>
            </ul>
          </div>

          <!-- Credit Rating -->
          <div class="rating">
            <span class="rating-label">{{ score.individualCreditScoring }}</span>
            <div class="rating-value">
              <span>Credit Rating</span>
              <strong [ngClass]="getRatingClass(score.creditRating)">
                {{ score.creditRating }}
              </strong>
            </div>
          </div>
        </div>

        <button class="see-more" (click)="onSeeMore(score)">See More</button>
      </div>
    </div>
  </div>
</div>
